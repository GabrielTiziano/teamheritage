spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/teamheritage
    username: teamheritage
    password: teamheritage
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    show-sql: true
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true;

  flyway:
    enabled: true

jwt:
  public-key: classpath:app.pub
  private-key: classpath:app.key