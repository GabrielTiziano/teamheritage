services:
  postgres:
    image: postgres:16-alpine
    container_name: teamheritage-postgres
    environment:
      POSTGRES_DB: teamheritage
      POSTGRES_USER: teamheritage
      POSTGRES_PASSWORD: teamheritage
    ports:
      - "5432:5432"
    volumes:
      - teamheritage_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teamheritage"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  teamheritage_pgdata: